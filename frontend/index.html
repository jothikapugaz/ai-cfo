<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>AI Personal CFO</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    /* Critical inline styles — always work even without Tailwind */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(90deg, #a78bfa, #f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
    }
    input, select, textarea {
      color: #ffffff !important;
      caret-color: #a78bfa !important;
      background-color: #1e293b !important;
    }
    .pulse-orb {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle at 30% 30%, #a78bfa, #7c3aed);
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(124, 58, 237, 0.7);
      animation: orb 2s infinite;
      transition: all 0.3s ease;
    }
    @keyframes orb {
      0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.7); transform: scale(1); }
      50% { box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); transform: scale(1.05); }
      100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); transform: scale(1); }
    }
    .recording .pulse-orb {
      background: radial-gradient(circle, #f43f5e, #e11d48);
      animation: orb 0.8s infinite;
    }
    .uploading .pulse-orb {
      background: radial-gradient(circle, #f59e0b, #d97706);
      animation: orb 0.6s infinite;
    }
    .streaming .pulse-orb {
      background: radial-gradient(circle, #34d399, #10b981);
      animation: orb 0.9s infinite;
    }
    #authSection, #appSection {
      flex: 1;
      padding: 24px 16px;
    }
    .hidden {
      display: none;
    }
    input, select, textarea {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      width: 100%;
      font-size: 16px;
      outline: none;
      caret-color: #a78bfa;
    }
    input::placeholder, textarea::placeholder {
      color: #94a3b8;
    }
    button {
      background-color: #7c3aed;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.97);
    }
    .tab-btn {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    .tab-active {
      background: linear-gradient(90deg, #7c3aed, #a855f7);
      color: white;
    }
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 8px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .swipe-card {
      transition: transform 0.3s ease;
      touch-action: pan-x;
    }
    #offlineBanner {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background-color: #f59e0b;
      color: #000000;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      z-index: 50;
    }
    .error-message {
      background-color: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>AI CFO</h1>
    <div id="pulseOrb" class="pulse-orb"></div>
  </header>

  <section id="authSection">
    <div style="margin-bottom: 16px;">
      <div id="authError" class="error-message hidden"></div>
    </div>
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <button id="loginTabBtn" style="flex: 1;" class="tab-btn tab-active">Login</button>
      <button id="registerTabBtn" style="flex: 1;" class="tab-btn">Register</button>
    </div>
    <div id="loginForm" style="display: flex; flex-direction: column; gap: 12px;">
      <input id="loginEmail" type="email" placeholder="Email" />
      <input id="loginPassword" type="password" placeholder="Password" />
      <button id="loginSubmit">Sign In</button>
    </div>
    <div id="registerForm" style="display: none; flex-direction: column; gap: 12px;">
      <input id="regEmail" type="email" placeholder="Email" />
      <input id="regPassword" type="password" placeholder="Password (min 8 chars)" />
      <select id="regLanguage">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <option value="bn">Bengali</option>
      </select>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
        <input type="checkbox" id="regLowLiteracy" style="width: auto;" /> Low literacy / icon mode
      </label>
      <button id="registerSubmit">Create Account</button>
    </div>
  </section>

  <section id="appSection" class="hidden" style="display: none; flex-direction: column; flex: 1;">
    <div class="tab-bar">
      <button data-tab="dashboard" class="tab-btn tab-active">Home</button>
      <button data-tab="receipts" class="tab-btn">Receipts</button>
      <button data-tab="income" class="tab-btn">Income</button>
      <button data-tab="insights" class="tab-btn">Insights</button>
      <button data-tab="voice" class="tab-btn">Voice</button>
    </div>
    <div id="tabContent" style="flex: 1; overflow-y: auto; padding: 16px;"></div>
  </section>

  <input type="file" id="receiptFileInput" accept="image/*" capture="environment" style="display: none;" />
  <input type="file" id="audioFileInput" accept="audio/*" style="display: none;" />
  <audio id="audioPlayback" style="display: none;"></audio>
  <div id="offlineBanner" class="hidden">Offline — changes queued</div>

  <script>
    const API = '';
    let token = localStorage.getItem('cfotoken');
    let currentUser = null;
    let currentTab = 'dashboard';
    let mediaRecorder = null;
    let audioChunks = [];
    const offlineQueueKey = 'cfoOfflineQueue';

    function apiFetch(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      return fetch(url, { ...options, headers });
    }

    function showAuth() {
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('appSection').style.display = 'none';
    }

    function showApp() {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('appSection').style.display = 'flex';
      renderTab(currentTab);
    }

    function setPulse(state) {
      const body = document.body;
      body.classList.remove('recording', 'uploading', 'streaming');
      if (state) {
        body.classList.add(state);
        setTimeout(() => body.classList.remove(state), 3000);
      }
    }

    function formatCurrency(amount) {
      const num = Number(amount);
      if (isNaN(num)) return amount;
      const lang = currentUser?.primary_language || 'en';
      const currency = (lang === 'en-US' || lang.includes('US')) ? 'USD' : 'INR';
      const locale = (lang === 'en-US') ? 'en-US' : 'en-IN';
      try {
        return new Intl.NumberFormat(locale, { style: 'currency', currency, maximumFractionDigits: 2 }).format(num);
      } catch {
        return `${currency} ${num.toFixed(2)}`;
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      const utter = new SpeechSynthesisUtterance(text);
      const langMap = { en: 'en-US', hi: 'hi-IN', ta: 'ta-IN', te: 'te-IN', bn: 'bn-IN' };
      utter.lang = langMap[currentUser?.primary_language || 'en'] || 'en-US';
      setPulse('streaming');
      speechSynthesis.speak(utter);
    }

    function dataURLtoBlob(dataUrl, mime) {
      const arr = dataUrl.split(',');
      const byteString = atob(arr[1]);
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
      return new Blob([ab], { type: mime || 'application/octet-stream' });
    }

    function updateOfflineBanner() {
      const queue = JSON.parse(localStorage.getItem(offlineQueueKey) || '[]');
      document.getElementById('offlineBanner').classList.toggle('hidden', queue.length === 0);
    }

    function queueUpload(endpoint, filename, dataUrl, mimeType, extraFields = {}) {
      const queue = JSON.parse(localStorage.getItem(offlineQueueKey) || '[]');
      queue.push({ type: 'upload', endpoint, filename, dataUrl, mimeType, extraFields });
      localStorage.setItem(offlineQueueKey, JSON.stringify(queue));
      updateOfflineBanner();
    }

    async function processQueue() {
      if (!navigator.onLine) return;
      const queue = JSON.parse(localStorage.getItem(offlineQueueKey) || '[]');
      if (!queue.length || !token) return;
      for (let i = queue.length - 1; i >= 0; i--) {
        const item = queue[i];
        try {
          const blob = dataURLtoBlob(item.dataUrl, item.mimeType);
          const fd = new FormData();
          fd.append('file', blob, item.filename);
          Object.entries(item.extraFields || {}).forEach(([k, v]) => fd.append(k, v));
          const res = await fetch(item.endpoint, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: fd
          });
          if (res.ok) {
            queue.splice(i, 1);
            localStorage.setItem(offlineQueueKey, JSON.stringify(queue));
          } else {
            break;
          }
        } catch (e) {
          break;
        }
      }
      updateOfflineBanner();
    }

    async function renderTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        const isActive = btn.dataset.tab === tab;
        btn.classList.toggle('tab-active', isActive);
      });
      switch (tab) {
        case 'dashboard': renderDashboard(); break;
        case 'receipts': renderReceipts(); break;
        case 'income': renderIncome(); break;
        case 'insights': renderInsights(); break;
        case 'voice': renderVoice(); break;
      }
    }

    async function renderDashboard() {
      const container = document.getElementById('tabContent');
      container.innerHTML = '<div style="text-align:center; padding:40px 0;">Loading...</div>';
      try {
        const [receiptsRes, incomeRes, insightsRes] = await Promise.all([
          apiFetch('/receipts'),
          apiFetch('/incomes'),
          apiFetch('/insights')
        ]);
        const receipts = await receiptsRes.json();
        const incomes = await incomeRes.json();
        const insights = await insightsRes.json();
        const totalSpent = receipts.reduce((acc, r) => acc + Number(r.total_amount), 0);
        const totalIncome = incomes.reduce((acc, i) => acc + Number(i.amount), 0);
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <div class="card">
              <p style="font-size: 14px; color: #94a3b8;">Net Cash Flow</p>
              <p style="font-size: 28px; font-weight: bold; margin-top: 4px;">${formatCurrency(totalIncome - totalSpent)}</p>
              <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Income ${formatCurrency(totalIncome)} • Spent ${formatCurrency(totalSpent)}</p>
            </div>
            <div class="card">
              <p style="font-size: 14px; color: #94a3b8;">AI Insights</p>
              ${insights.length ? insights.slice(0, 3).map(i => `
                <div style="margin-top: 12px; display: flex; align-items: flex-start; gap: 8px;">
                  <span style="color: #a78bfa;">✦</span>
                  <div style="flex: 1;">
                    <p style="font-size: 14px;">${i.insight_text}</p>
                    <p style="font-size: 12px; color: #64748b;">${i.category}</p>
                  </div>
                  <button onclick="speakText('${i.insight_text.replace(/'/g, '\\\'')}')" style="width: auto; background: none; color: #a78bfa; padding: 4px;">🔊</button>
                </div>
              `).join('') : '<p style="margin-top: 8px; font-size: 14px; color: #64748b;">No insights yet. Go to Insights tab to generate.</p>'}
            </div>
            <button onclick="document.getElementById('receiptFileInput').click()" style="background-color: #7c3aed; font-size: 18px;">📷 Add Receipt</button>
            <button onclick="renderTab('voice')" style="background-color: #059669; font-size: 18px;">🎤 Voice Triage</button>
          </div>
        `;
      } catch (e) {
        container.innerHTML = `<div style="text-align:center; padding:40px 0; color:#ef4444;">${e.message}</div>`;
      }
    }

    async function renderReceipts() {
      const container = document.getElementById('tabContent');
      container.innerHTML = '<div style="text-align:center; padding:40px 0;">Loading receipts...</div>';
      try {
        const res = await apiFetch('/receipts');
        const receipts = await res.json();
        if (!receipts.length) {
          container.innerHTML = `
            <div style="text-align:center; padding:80px 0;">
              <p style="color: #94a3b8;">No receipts yet</p>
              <button onclick="document.getElementById('receiptFileInput').click()" style="margin-top: 16px; background-color: #7c3aed;">Add Receipt</button>
            </div>`;
          return;
        }
        container.innerHTML = receipts.map(r => `
          <div class="card swipe-card" data-id="${r.receipt_id}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <p style="font-weight: 600;">${r.merchant_name || 'Unknown'}</p>
                <p style="font-size: 12px; color: #94a3b8;">${new Date(r.timestamp).toLocaleDateString()}</p>
              </div>
              <div style="text-align: right;">
                <p style="font-size: 18px; font-weight: bold; color: #a78bfa;">${formatCurrency(r.total_amount)}</p>
                <span style="font-size: 12px; padding: 2px 8px; border-radius: 20px; background: ${r.processing_status === 'Success' ? 'rgba(16,185,129,0.2)' : 'rgba(245,158,11,0.2)'}; color: ${r.processing_status === 'Success' ? '#6ee7b7' : '#fcd34d'};">${r.processing_status}</span>
              </div>
            </div>
            ${r.line_items.length ? r.line_items.map(i => `
              <div style="margin-top: 8px; font-size: 12px; display: flex; justify-content: space-between; border-top: 1px solid #334155; padding-top: 8px;">
                <span>${i.product_name}</span>
                <span>${i.quantity} × ${formatCurrency(i.unit_price)}</span>
              </div>
            `).join('') : '<p style="font-size: 12px; color: #fcd34d; margin-top: 8px;">Incomplete — tap Voice tab to split items</p>'}
          </div>
        `).join('');
        attachSwipeHandlers();
      } catch (e) {
        container.innerHTML = `<div style="text-align:center; padding:40px 0; color:#ef4444;">${e.message}</div>`;
      }
    }

    function attachSwipeHandlers() {
      document.querySelectorAll('.swipe-card').forEach((card) => {
        let startX = 0;
        let dx = 0;
        card.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
        card.addEventListener('touchmove', (e) => {
          dx = e.touches[0].clientX - startX;
          card.style.transform = `translateX(${dx}px)`;
        });
        card.addEventListener('touchend', () => {
          if (Math.abs(dx) > 80) {
            card.style.transform = dx > 0 ? 'translateX(120%)' : 'translateX(-120%)';
            setTimeout(() => card.remove(), 300);
          } else {
            card.style.transform = 'translateX(0)';
          }
          dx = 0;
        });
      });
    }

    async function renderIncome() {
      const container = document.getElementById('tabContent');
      container.innerHTML = '<div style="text-align:center; padding:40px 0;">Loading income...</div>';
      try {
        const res = await apiFetch('/incomes');
        const incomes = await res.json();
        container.innerHTML = `
          <div class="card">
            <p style="font-size: 14px; color: #94a3b8;">Total Income</p>
            <p style="font-size: 24px; font-weight: bold;">${formatCurrency(incomes.reduce((acc, i) => acc + Number(i.amount), 0))}</p>
          </div>
          <form id="incomeForm" class="card" style="display: flex; flex-direction: column; gap: 12px;">
            <input id="incomeAmount" type="number" step="0.01" placeholder="Amount" />
            <select id="incomeSource">
              <option value="salary">Salary</option>
              <option value="daily wages">Daily Wages</option>
              <option value="cash">Cash</option>
            </select>
            <button type="submit" style="background-color: #059669;">Add Income</button>
          </form>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            ${incomes.map(i => `
              <div class="card" style="padding: 12px; display: flex; justify-content: space-between;">
                <div><p style="font-weight: 500;">${i.source}</p><p style="font-size: 12px; color: #64748b;">${new Date(i.timestamp).toLocaleDateString()}</p></div>
                <p style="font-weight: bold; color: #6ee7b7;">${formatCurrency(i.amount)}</p>
              </div>
            `).join('')}
          </div>
        `;
        document.getElementById('incomeForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const amount = document.getElementById('incomeAmount').value;
          const source = document.getElementById('incomeSource').value;
          if (!amount) return;
          await apiFetch('/incomes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: Number(amount), source })
          });
          renderIncome();
        });
      } catch (e) {
        container.innerHTML = `<div style="text-align:center; padding:40px 0; color:#ef4444;">${e.message}</div>`;
      }
    }

    async function renderInsights() {
      const container = document.getElementById('tabContent');
      container.innerHTML = '<div style="text-align:center; padding:40px 0;">Loading insights...</div>';
      try {
        const res = await apiFetch('/insights');
        const insights = await res.json();
        container.innerHTML = `
          <button id="generateInsightsBtn" style="background-color: #7c3aed; font-size: 18px;">✨ Generate Strategic Insights</button>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
            ${insights.length ? insights.map(i => `
              <div class="card">
                <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
                  <p style="font-size: 14px;">${i.insight_text}</p>
                  <button onclick="speakText('${i.insight_text.replace(/'/g, '\\\'')}')" style="width: auto; background: none; color: #a78bfa; padding: 4px;">🔊</button>
                </div>
                <p style="font-size: 12px; color: #64748b; margin-top: 8px;">${i.category} • ${new Date(i.timestamp).toLocaleDateString()}</p>
              </div>
            `).join('') : '<p style="text-align:center; color: #64748b; margin-top: 16px;">No insights yet. Tap Generate.</p>'}
          </div>
        `;
        document.getElementById('generateInsightsBtn').addEventListener('click', async () => {
          await apiFetch('/insights/generate', { method: 'POST' });
          renderInsights();
        });
      } catch (e) {
        container.innerHTML = `<div style="text-align:center; padding:40px 0; color:#ef4444;">${e.message}</div>`;
      }
    }

    async function renderVoice() {
      const container = document.getElementById('tabContent');
      let incompleteReceipts = [];
      try {
        const res = await apiFetch('/receipts');
        const receipts = await res.json();
        incompleteReceipts = receipts.filter(r => r.processing_status === 'Incomplete');
      } catch (e) {}

      container.innerHTML = `
        <div class="card" style="text-align: center;">
          <p style="color: #94a3b8; margin-bottom: 16px;">Tap to speak your purchase details</p>
          <button id="recordBtn" style="width: 96px; height: 96px; border-radius: 50%; background-color: #dc2626; font-size: 36px;">🎤</button>
          <p id="recordingStatus" style="margin-top: 12px; font-size: 14px; color: #94a3b8;">Not recording</p>
          <div style="margin-top: 16px;">
            <label style="font-size: 14px; color: #94a3b8;">Link to incomplete receipt (optional)</label>
            <select id="voiceReceiptSelect" style="margin-top: 8px;">
              <option value="">None</option>
              ${incompleteReceipts.map(r => `<option value="${r.receipt_id}">${r.merchant_name || 'Unknown'} — ${formatCurrency(r.total_amount)}</option>`).join('')}
            </select>
          </div>
          <button id="uploadAudioBtn" style="margin-top: 16px; background-color: #475569;">Upload Audio File</button>
        </div>
      `;

      const recordBtn = document.getElementById('recordBtn');
      const statusEl = document.getElementById('recordingStatus');
      let isRecording = false;

      recordBtn.addEventListener('click', async () => {
        if (isRecording) {
          mediaRecorder.stop();
          isRecording = false;
          statusEl.textContent = 'Processing...';
          setPulse('uploading');
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert('Microphone not supported');
          return;
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          const receiptId = document.getElementById('voiceReceiptSelect').value;
          const dataUrl = await new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(blob);
          });
          const extra = {};
          if (receiptId) extra['receipt_id'] = receiptId;
          if (navigator.onLine) {
            const fd = new FormData();
            fd.append('file', blob, 'voice.webm');
            Object.entries(extra).forEach(([k, v]) => fd.append(k, v));
            try {
              await apiFetch('/voice', { method: 'POST', body: fd });
            } catch (e) {}
          } else {
            queueUpload('/voice', 'voice.webm', dataUrl, 'audio/webm', extra);
          }
          statusEl.textContent = 'Transcription queued';
          renderVoice();
        };
        mediaRecorder.start();
        isRecording = true;
        statusEl.textContent = 'Recording...';
        setPulse('recording');
      });

      document.getElementById('uploadAudioBtn').addEventListener('click', () => {
        document.getElementById('audioFileInput').click();
      });
    }

    // File upload handling
    document.getElementById('receiptFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setPulse('uploading');
      const dataUrl = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
      if (navigator.onLine) {
        const fd = new FormData();
        fd.append('file', file);
        try {
          await apiFetch('/receipts', { method: 'POST', body: fd });
        } catch (err) {}
      } else {
        queueUpload('/receipts', file.name, dataUrl, file.type);
      }
      e.target.value = '';
      renderTab('receipts');
    });

    document.getElementById('audioFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const dataUrl = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
      if (navigator.onLine) {
        const fd = new FormData();
        fd.append('file', file);
        try {
          await apiFetch('/voice', { method: 'POST', body: fd });
        } catch (err) {}
      } else {
        queueUpload('/voice', file.name, dataUrl, file.type);
      }
      e.target.value = '';
      renderVoice();
    });

    // Auth tab switch
    document.getElementById('loginTabBtn').addEventListener('click', () => {
      document.getElementById('loginForm').style.display = 'flex';
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginTabBtn').classList.add('tab-active');
      document.getElementById('registerTabBtn').classList.remove('tab-active');
    });
    document.getElementById('registerTabBtn').addEventListener('click', () => {
      document.getElementById('registerForm').style.display = 'flex';
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerTabBtn').classList.add('tab-active');
      document.getElementById('loginTabBtn').classList.remove('tab-active');
    });

    document.getElementById('loginSubmit').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const params = new URLSearchParams();
      params.append('username', email);
      params.append('password', password);
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        token = data.access_token;
        localStorage.setItem('cfotoken', token);
        currentUser = data.user;
        showApp();
        processQueue();
      } catch (e) {
        const err = document.getElementById('authError');
        err.textContent = e.message;
        err.classList.remove('hidden');
      }
    });

    document.getElementById('registerSubmit').addEventListener('click', async () => {
      const payload = {
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value,
        primary_language: document.getElementById('regLanguage').value,
        low_literacy_mode: document.getElementById('regLowLiteracy').checked
      };
      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.detail || 'Registration failed');
        }
        // Auto-login after register
        document.getElementById('loginEmail').value = payload.email;
        document.getElementById('loginPassword').value = payload.password;
        document.getElementById('loginSubmit').click();
      } catch (e) {
        const err = document.getElementById('authError');
        err.textContent = e.message;
        err.classList.remove('hidden');
      }
    });

    document.querySelectorAll('.tab-bar .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => renderTab(btn.dataset.tab));
    });

    window.addEventListener('online', processQueue);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

    async function loadApp() {
      if (!token) {
        showAuth();
        return;
      }
      try {
        const res = await apiFetch('/auth/me');
        if (!res.ok) throw new Error('Session expired');
        currentUser = await res.json();
        showApp();
        processQueue();
      } catch (e) {
        localStorage.removeItem('cfotoken');
        token = null;
        showAuth();
      }
    }

    updateOfflineBanner();
    loadApp();
  </script>
</body>
        </html>
